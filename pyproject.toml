[project]
name = "daydream"
version = "0.1.0"
description = "Independent implementation of Dream-RSI: improve an exploration policy by replaying discovery trees."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
daydream = "daydream.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
